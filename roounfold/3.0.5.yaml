name: roounfold
version: "3.0.5"
url: "https://gitlab.cern.ch/RooUnfold/RooUnfold/-/archive/{version}/RooUnfold-{version}.tar.gz"
build_system: script
depends_on:
  - root
make_jobs: 4

build_script: "3.0.5.sh"
cppyy:
  headers:
    - RooUnfold.h
    - RooUnfoldResponse.h
    - RooUnfoldBayes.h
    - RooUnfoldSvd.h
    - RooUnfoldBinByBin.h
    - RooUnfoldInvert.h
  libraries:
    - RooUnfold
