name: cppyy
version: "3.5.0"
url: ""
build_system: script
make_jobs: 8
python_paths: ["."]

build_script: |
  set -e

  # Ensure setuptools is available for the pip source build backend
  pip install setuptools wheel --quiet

  # cmake 4.x changed if() parsing in a way that breaks cppyy-cling 6.32.8's
  # CMakeLists.txt:189. pip downloads cmake as a build dep for cppyy-cling in
  # a nested isolated environment, so a plain `pip install cmake<4` in the
  # outer venv is not enough. PIP_CONSTRAINT is inherited by all subprocess
  # pip invocations (including nested build-env installs), so it's the only
  # reliable way to pin cmake across the whole dependency chain.
  _cmake_constraint="{builddir}/cmake_constraint.txt"
  echo "cmake<4.0.0" > "$_cmake_constraint"
  export PIP_CONSTRAINT="$_cmake_constraint"
  # Also install a compatible cmake into the outer venv so `cmake --version`
  # below reports the right version and any direct cmake invocation is pinned.
  pip install "cmake<4.0.0" --quiet

  # On Linux, prefer g++/gcc explicitly — on SUSE/RHEL the default 'c++' may
  # point to an old system GCC (e.g. 7.5.0) while 'g++' is a newer GCC 13+.
  # On macOS, leave CC/CXX unset so Apple clang is used (g++ is not available
  # by default and forcing it breaks the build).
  if [[ "$(uname)" != "Darwin" ]]; then
    export CXX=g++ CC=gcc
    _compiler_msg="$(g++ --version | head -1)"
  else
    _compiler_msg="$(c++ --version | head -1)"
  fi

  # Clean up any existing installations (including corrupted partial ones)
  pip uninstall -y cppyy cppyy-backend cppyy-cling CPyCppyy 2>/dev/null || true

  # Install the full cppyy stack in ONE pip command to {prefix}, forcing
  # cppyy-cling to be built from source.
  #
  # --target {prefix}       : install to heppyyier-managed prefix (shareable
  #                           via HEPPYYIER_PACKAGES_DIR / HEPPYYIER_SYSTEM_PACKAGES_DIR)
  # --no-binary cppyy-cling : force source build of LLVM + cling (~30-90 min)
  # --no-cache-dir          : ignore cached wheels (avoids reusing a binary wheel
  #                           downloaded in a previous attempt)
  # STDCXX=17               : build with C++17 (required by cppyy-cling setup.py)
  # MAKE_NPROCS             : parallelism for the cmake/make build inside cppyy-cling
  echo "[cppyy] Building LLVM + cling from source (30-90 min)"
  echo "[cppyy] Compiler: $_compiler_msg"
  echo "[cppyy] cmake: $(cmake --version | head -1)"
  STDCXX=17 MAKE_NPROCS={n_cores} \
  pip install cppyy=={version} \
      --no-binary cppyy-cling \
      --no-cache-dir \
      --force-reinstall \
      --target {prefix} \
      --verbose

  # Verify — PYTHONPATH must include {prefix} since packages are not in site-packages.
  # libCling is a .dylib on macOS and a .so on Linux.
  PYTHONPATH={prefix} python3 -c "
  import cppyy, cppyy_backend, pathlib, sys
  base = pathlib.Path(cppyy_backend.__file__).parent / 'lib'
  lib = next((base / n for n in ('libCling.dylib', 'libCling.so') if (base / n).exists()), None)
  print('[cppyy]', cppyy.__version__, '- libCling:', lib.name if lib else 'NOT FOUND')
  if lib is None:
      sys.exit(1)
  "

  echo "{version}" > {prefix}/.cppyy_install
  echo "[cppyy] Done. Test with: PYTHONPATH={prefix} python3 -c 'import cppyy; print(cppyy.__version__)'"
