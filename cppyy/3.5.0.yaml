name: cppyy
version: "3.5.0"
url: ""
build_system: script
make_jobs: 8
python_paths: ["."]

build_script: |
  set -e

  # cmake 4.x breaks cppyy-cling 6.32.8's CMakeLists.txt:189.
  # pip creates nested isolated build environments that download cmake 4.x even
  # when PIP_CONSTRAINT is set — pip 26.x does not propagate constraint files
  # into these nested envs for build-system requirements.
  #
  # Fix: two-step build.
  #   Step 1 — `pip wheel --no-build-isolation`: build cppyy-cling as a wheel
  #     file using the VENV's cmake (3.x, installed here) instead of letting
  #     pip create an isolated env that downloads cmake 4.x.
  #   Step 2 — `pip install --find-links`: install cppyy pointing at the
  #     pre-built wheel. No cmake is invoked at install time.
  pip install setuptools wheel "cmake<4.0.0" --quiet

  # On Linux: use g++/gcc (SUSE/RHEL system 'c++' may be old GCC).
  # On macOS: leave CC/CXX unset — Apple clang is the right compiler.
  if [[ "$(uname)" != "Darwin" ]]; then
    export CXX=g++ CC=gcc
  fi
  echo "[cppyy] Compiler: $(${CXX:-c++} --version | head -1)"
  echo "[cppyy] cmake:    $(cmake --version | head -1)"

  pip uninstall -y cppyy cppyy-backend cppyy-cling CPyCppyy 2>/dev/null || true

  # Step 1: Build cppyy-cling as a local wheel using the venv's cmake.
  # --no-build-isolation: skip isolated build env → uses the venv's cmake<4
  # --no-deps: only wheel cppyy-cling itself, not its runtime deps
  echo "[cppyy] Building cppyy-cling wheel from source (~30-90 min)..."
  mkdir -p {builddir}/cppyy-wheels
  STDCXX=17 MAKE_NPROCS={n_cores} \
  pip wheel "cppyy-cling==6.32.8" \
      --no-binary cppyy-cling \
      --no-build-isolation \
      --no-cache-dir \
      --no-deps \
      -w {builddir}/cppyy-wheels \
      --verbose

  # Step 2: Install the full cppyy stack.
  # --find-links supplies the pre-built cppyy-cling wheel; pip uses it instead
  # of building from source — no cmake is invoked in this step.
  echo "[cppyy] Installing cppyy stack..."
  pip install "cppyy=={version}" \
      --find-links {builddir}/cppyy-wheels \
      --no-cache-dir \
      --force-reinstall \
      --target {prefix} \
      --verbose

  # Verify — PYTHONPATH must include {prefix} since packages land there, not in site-packages.
  # libCling is a .dylib on macOS and a .so on Linux.
  PYTHONPATH={prefix} python3 -c "
  import cppyy, cppyy_backend, pathlib, sys
  base = pathlib.Path(cppyy_backend.__file__).parent / 'lib'
  lib = next((base / n for n in ('libCling.dylib', 'libCling.so') if (base / n).exists()), None)
  print('[cppyy]', cppyy.__version__, '- libCling:', lib.name if lib else 'NOT FOUND')
  if lib is None:
      sys.exit(1)
  "

  echo "{version}" > {prefix}/.cppyy_install
  echo "[cppyy] Done. Test with: PYTHONPATH={prefix} python3 -c 'import cppyy; print(cppyy.__version__)'"
